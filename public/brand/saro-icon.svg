<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>

    <!-- Smooth BLACK → PURPLE → GREEN gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="22%" stop-color="#050505"/>
      <stop offset="38%" stop-color="#120a18"/>
      <stop offset="48%" stop-color="#4d00a8"/>
      <stop offset="54%" stop-color="#7000d9"/>
      <stop offset="62%" stop-color="#18351f"/>
      <stop offset="76%" stop-color="#087c3b"/>
      <stop offset="100%" stop-color="#00ff66"/>
    </linearGradient>

    <!-- Purple infinity gradient -->
    <linearGradient id="infinity" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7000ff"/>
      <stop offset="50%" stop-color="#e000ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>

    <!-- Purple center glow -->
    <radialGradient id="centerGlow">
      <stop offset="0%" stop-color="#d000ff" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#8b00ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8b00ff" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>

    <filter id="infinityGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    <clipPath id="rounded">
      <rect x="2" y="2" width="60" height="60" rx="15"/>
    </clipPath>

  </defs>

  <g clip-path="url(#rounded)">

    <!-- Main smooth gradient -->
    <rect
      width="64"
      height="64"
      fill="url(#bg)"
    />

    <!-- Large purple collision glow -->
    <ellipse
      cx="32"
      cy="32"
      rx="22"
      ry="18"
      fill="url(#centerGlow)"
      filter="url(#glow)"
    />

    <!-- Purple energy beam -->
    <ellipse
      cx="32"
      cy="32"
      rx="20"
      ry="5"
      fill="#b000ff"
      opacity="0.22"
      filter="url(#glow)"
    />

    <!-- Infinity glow -->
    <path
      d="M13 32
         C13 24 21 21 28 27
         L32 32
         L36 27
         C43 21 51 24 51 32
         C51 40 43 43 36 37
         L32 32
         L28 37
         C21 43 13 40 13 32Z"
      fill="none"
      stroke="#a000ff"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.5"
      filter="url(#infinityGlow)"
    />

    <!-- Main infinity -->
    <path
      d="M13 32
         C13 24 21 21 28 27
         L32 32
         L36 27
         C43 21 51 24 51 32
         C51 40 43 43 36 37
         L32 32
         L28 37
         C21 43 13 40 13 32Z"
      fill="none"
      stroke="url(#infinity)"
      stroke-width="4.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

  </g>

  <!-- Rounded border -->
  <rect
    x="2"
    y="2"
    width="60"
    height="60"
    rx="15"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.08"
    stroke-width="1"
  />

</svg>
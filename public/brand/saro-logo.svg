<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 360 96"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Saro by Aro</title>
  <desc id="desc">Saro logo with a purple infinity symbol on a black, purple and green gradient background.</desc>

  <defs>

    <!-- ========================================================= -->
    <!-- ICON BACKGROUND                                            -->
    <!-- ========================================================= -->

    <linearGradient
      id="bg"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="0%"
    >
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="22%" stop-color="#050505"/>
      <stop offset="38%" stop-color="#120a18"/>
      <stop offset="48%" stop-color="#4d00a8"/>
      <stop offset="54%" stop-color="#7000d9"/>
      <stop offset="62%" stop-color="#18351f"/>
      <stop offset="76%" stop-color="#087c3b"/>
      <stop offset="100%" stop-color="#00ff66"/>
    </linearGradient>


    <!-- ========================================================= -->
    <!-- INFINITY GRADIENT                                         -->
    <!-- ========================================================= -->

    <linearGradient
      id="infinity"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="100%"
    >
      <stop offset="0%" stop-color="#7000ff"/>
      <stop offset="50%" stop-color="#e000ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>


    <!-- ========================================================= -->
    <!-- CENTER GLOW                                                -->
    <!-- ========================================================= -->

    <radialGradient id="centerGlow">

      <stop
        offset="0%"
        stop-color="#d000ff"
        stop-opacity="0.55"
      />

      <stop
        offset="35%"
        stop-color="#8b00ff"
        stop-opacity="0.25"
      />

      <stop
        offset="100%"
        stop-color="#8b00ff"
        stop-opacity="0"
      />

    </radialGradient>


    <!-- ========================================================= -->
    <!-- ICON GLOW                                                   -->
    <!-- ========================================================= -->

    <filter
      id="glow"
      x="-100%"
      y="-100%"
      width="300%"
      height="300%"
    >
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>


    <filter
      id="infinityGlow"
      x="-80%"
      y="-80%"
      width="260%"
      height="260%"
    >
      <feGaussianBlur stdDeviation="2"/>
    </filter>


    <!-- ========================================================= -->
    <!-- ICON CLIP                                                   -->
    <!-- ========================================================= -->

    <clipPath id="iconClip">
      <rect
        x="8"
        y="8"
        width="80"
        height="80"
        rx="20"
      />
    </clipPath>

  </defs>


  <!-- =========================================================== -->
  <!-- SARO ICON                                                    -->
  <!-- =========================================================== -->

  <g clip-path="url(#iconClip)">

    <!-- Background -->
    <rect
      x="8"
      y="8"
      width="80"
      height="80"
      fill="url(#bg)"
    />


    <!-- Center glow -->
    <ellipse
      cx="48"
      cy="48"
      rx="29"
      ry="24"
      fill="url(#centerGlow)"
      filter="url(#glow)"
    />


    <!-- Energy beam -->
    <ellipse
      cx="48"
      cy="48"
      rx="25"
      ry="6"
      fill="#b000ff"
      opacity="0.22"
      filter="url(#glow)"
    />


    <!-- Infinity glow -->
    <path
      d="
        M24 48
        C24 38 34 34 43 42
        L48 48
        L53 42
        C62 34 72 38 72 48
        C72 58 62 62 53 54
        L48 48
        L43 54
        C34 62 24 58 24 48
        Z
      "
      fill="none"
      stroke="#a000ff"
      stroke-width="8"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.5"
      filter="url(#infinityGlow)"
    />


    <!-- Main infinity -->
    <path
      d="
        M24 48
        C24 38 34 34 43 42
        L48 48
        L53 42
        C62 34 72 38 72 48
        C72 58 62 62 53 54
        L48 48
        L43 54
        C34 62 24 58 24 48
        Z
      "
      fill="none"
      stroke="url(#infinity)"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

  </g>


  <!-- =========================================================== -->
  <!-- ICON BORDER                                                  -->
  <!-- =========================================================== -->

  <rect
    x="8"
    y="8"
    width="80"
    height="80"
    rx="20"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.08"
    stroke-width="1"
  />


  <!-- =========================================================== -->
  <!-- SARO WORDMARK                                                -->
  <!-- =========================================================== -->

  <text
    x="112"
    y="56"
    fill="#ffffff"
    font-family="Inter, Arial, Helvetica, sans-serif"
    font-size="42"
    font-weight="700"
    letter-spacing="-1.5"
  >
    SARO
  </text>


  <!-- =========================================================== -->
  <!-- BY ARO                                                       -->
  <!-- =========================================================== -->

  <text
    x="115"
    y="76"
    fill="#a7a7a7"
    font-family="Inter, Arial, Helvetica, sans-serif"
    font-size="11"
    font-weight="500"
    letter-spacing="3"
  >
    BY ARO
  </text>

</svg>